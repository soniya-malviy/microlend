name: Keep Render awake

# Hits /health every 30 minutes from GitHub so a sleeping Render free instance
# actually receives an inbound request. In-process node-cron cannot wake a
# service that has already spun down.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoints
        env:
          KEEP_ALIVE_URL: ${{ secrets.KEEP_ALIVE_URL }}
          KEEP_ALIVE_URLS: ${{ secrets.KEEP_ALIVE_URLS }}
        run: |
          set -euo pipefail
          URLS="${KEEP_ALIVE_URLS:-$KEEP_ALIVE_URL}"
          if [ -z "$URLS" ]; then
            echo "Set GitHub secret KEEP_ALIVE_URL to https://YOUR-SERVICE.onrender.com"
            exit 1
          fi
          IFS=',' read -ra PARTS <<< "$URLS"
          for raw in "${PARTS[@]}"; do
            origin="$(echo "$raw" | xargs | sed 's:/*$::')"
            case "$origin" in
              */health) url="$origin" ;;
              *) url="$origin/health" ;;
            esac
            echo "GET $url"
            curl -fsS --max-time 60 "$url"
            echo
          done
