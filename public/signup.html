<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create account · MicroLend</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="min-h-screen text-slate-800 antialiased">
  <div class="grid min-h-screen lg:grid-cols-2">
    <section class="auth-panel relative hidden overflow-hidden lg:flex lg:flex-col lg:justify-between lg:p-12">
      <div class="flex items-center gap-2">
        <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-white/15 text-sm font-semibold text-white ring-1 ring-white/20">M</span>
        <p class="text-lg font-semibold tracking-tight text-white">MicroLend</p>
      </div>
      <div>
        <p class="text-xs font-semibold uppercase tracking-[0.2em] text-indigo-200">Onboard in minutes</p>
        <h1 class="mt-3 max-w-md text-4xl font-semibold leading-tight tracking-tight text-white">Identity first. Credit second. Money last.</h1>
        <p class="mt-4 max-w-sm text-sm leading-6 text-indigo-100">Create an account, verify KYC, generate a limit, then pay the Razorpay order to disburse.</p>
      </div>
      <p class="text-xs text-indigo-200">Passwords hashed with bcrypt · JWT for 7 days</p>
    </section>
    <div class="flex items-center justify-center px-4 py-12">
      <div class="w-full max-w-md">
        <h2 class="text-2xl font-semibold tracking-tight text-slate-900">Create account</h2>
        <p class="mt-1 text-sm text-slate-500">All fields are required.</p>
        <form id="signup-form" class="mt-8 space-y-4" novalidate>
          <div>
            <label class="text-sm font-medium text-slate-700" for="name">Full name</label>
            <input id="name" name="name" required class="mt-1.5 block w-full rounded-xl border-0 bg-white px-3 py-2.5 text-sm shadow-sm ring-1 ring-inset ring-slate-200 focus:ring-2 focus:ring-indigo-500" />
          </div>
          <div>
            <label class="text-sm font-medium text-slate-700" for="email">Email</label>
            <input id="email" name="email" type="email" required class="mt-1.5 block w-full rounded-xl border-0 bg-white px-3 py-2.5 text-sm shadow-sm ring-1 ring-inset ring-slate-200 focus:ring-2 focus:ring-indigo-500" />
          </div>
          <div>
            <label class="text-sm font-medium text-slate-700" for="phone">Phone</label>
            <input id="phone" name="phone" type="tel" required class="mt-1.5 block w-full rounded-xl border-0 bg-white px-3 py-2.5 text-sm shadow-sm ring-1 ring-inset ring-slate-200 focus:ring-2 focus:ring-indigo-500" />
          </div>
          <div>
            <label class="text-sm font-medium text-slate-700" for="password">Password</label>
            <input id="password" name="password" type="password" minlength="6" required class="mt-1.5 block w-full rounded-xl border-0 bg-white px-3 py-2.5 text-sm shadow-sm ring-1 ring-inset ring-slate-200 focus:ring-2 focus:ring-indigo-500" />
          </div>
          <button id="submit-btn" type="submit" class="inline-flex w-full items-center justify-center rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-700 disabled:opacity-60">
            Create account
          </button>
        </form>
        <p class="mt-6 text-sm text-slate-500">Already registered? <a class="font-medium text-indigo-600 hover:text-indigo-700" href="/login.html">Sign in</a></p>
      </div>
    </div>
  </div>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/signup.js"></script>
</body>
</html>
