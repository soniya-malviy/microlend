<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Credit score · MicroLend</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="/images/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="text-slate-800 antialiased">
  <div id="app">
    <div id="page-content">
      <p class="text-xs font-semibold uppercase tracking-[0.16em] text-indigo-600">Underwriting</p>
      <h1 class="mt-1 text-2xl font-semibold tracking-tight text-slate-900">Credit score</h1>
      <p class="mt-1 text-sm text-slate-500">Rule-based score maps to an INR approved limit used at checkout.</p>
      <div class="mt-8 grid gap-6 lg:grid-cols-2">
        <form id="score-form" class="space-y-4 rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-100">
          <div>
            <label class="text-sm font-medium text-slate-700" for="monthly_income">Monthly income (INR)</label>
            <input id="monthly_income" name="monthly_income" type="number" min="0" required class="mt-1.5 block w-full rounded-xl border-0 px-3 py-2.5 text-sm shadow-sm ring-1 ring-inset ring-slate-200 focus:ring-2 focus:ring-indigo-500" />
          </div>
          <div>
            <label class="text-sm font-medium text-slate-700" for="existing_debt">Existing debt (INR)</label>
            <input id="existing_debt" name="existing_debt" type="number" min="0" required class="mt-1.5 block w-full rounded-xl border-0 px-3 py-2.5 text-sm shadow-sm ring-1 ring-inset ring-slate-200 focus:ring-2 focus:ring-indigo-500" />
          </div>
          <div>
            <label class="text-sm font-medium text-slate-700" for="employment_type">Employment type</label>
            <select id="employment_type" name="employment_type" required class="mt-1.5 block w-full rounded-xl border-0 px-3 py-2.5 text-sm shadow-sm ring-1 ring-inset ring-slate-200 focus:ring-2 focus:ring-indigo-500">
              <option value="">Select</option>
              <option value="salaried">Salaried</option>
              <option value="self-employed">Self-employed</option>
              <option value="unemployed">Unemployed</option>
            </select>
          </div>
          <button id="submit-btn" type="submit" class="inline-flex items-center justify-center rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-700 disabled:opacity-60">Calculate score</button>
        </form>
        <div id="score-result" class="flex flex-col items-center justify-center rounded-2xl bg-white p-8 shadow-sm ring-1 ring-slate-100">
          <p class="text-sm text-slate-500">Submit the form to generate a score and limit.</p>
        </div>
      </div>
    </div>
  </div>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/credit-score.js"></script>
</body>
</html>
