<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile · MicroLend</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="/images/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="text-slate-800 antialiased">
  <div id="app">
    <div id="page-content">
      <div class="grid gap-6 lg:grid-cols-5">
        <div class="lg:col-span-3">
          <p class="text-xs font-semibold uppercase tracking-[0.16em] text-indigo-600">Account</p>
          <h1 class="mt-1 text-2xl font-semibold tracking-tight text-slate-900">Profile</h1>
          <p class="mt-1 text-sm text-slate-500">Details used to prefill Razorpay Checkout.</p>
          <div id="profile-card" class="mt-8 rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-100">
            <p class="text-sm text-slate-500">Loading…</p>
          </div>
        </div>
        <aside class="lg:col-span-2">
          <div class="overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-slate-100">
            <div class="pay-card-art h-40"></div>
            <div class="p-5">
              <p class="text-sm font-semibold text-slate-900">Checkout prefill</p>
              <p class="mt-2 text-sm leading-6 text-slate-600">Name, email, and phone are sent to Razorpay when you tap Pay securely. Card data never touches MicroLend.</p>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </div>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
