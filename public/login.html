<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · MicroLend</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { brand: '#4F46E5' } } } };
  </script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
  <div class="grid min-h-screen lg:grid-cols-2">
    <div class="relative hidden bg-indigo-600 lg:flex lg:flex-col lg:justify-between lg:p-12">
      <p class="text-lg font-semibold tracking-tight text-white">MicroLend</p>
      <div>
        <h1 class="max-w-md text-3xl font-semibold tracking-tight text-white">Credit that feels as clear as a payments dashboard.</h1>
        <p class="mt-4 max-w-sm text-sm leading-6 text-indigo-100">KYC, scoring, and disbursement in one place — built for operators who need auditability.</p>
      </div>
      <p class="text-xs text-indigo-200">Test mode · Razorpay</p>
    </div>
    <div class="flex items-center justify-center px-4 py-12">
      <div class="w-full max-w-md">
        <div class="mb-8 lg:hidden">
          <p class="text-lg font-semibold text-slate-900">MicroLend</p>
        </div>
        <h2 class="text-2xl font-semibold tracking-tight text-slate-900">Sign in</h2>
        <p class="mt-1 text-sm text-slate-500">Use your work email to continue.</p>
        <form id="login-form" class="mt-8 space-y-4" novalidate>
          <div>
            <label class="text-sm font-medium text-slate-700" for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required
              class="mt-1.5 block w-full rounded-lg border-0 px-3 py-2.5 text-sm shadow-sm ring-1 ring-inset ring-slate-200 placeholder:text-slate-400 focus:ring-2 focus:ring-indigo-500" />
          </div>
          <div>
            <label class="text-sm font-medium text-slate-700" for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required
              class="mt-1.5 block w-full rounded-lg border-0 px-3 py-2.5 text-sm shadow-sm ring-1 ring-inset ring-slate-200 focus:ring-2 focus:ring-indigo-500" />
          </div>
          <button id="submit-btn" type="submit"
            class="inline-flex w-full items-center justify-center rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-medium text-white shadow-sm hover:bg-indigo-700 disabled:opacity-60">
            Sign in
          </button>
        </form>
        <p class="mt-6 text-sm text-slate-500">No account? <a class="font-medium text-indigo-600 hover:text-indigo-700" href="/signup.html">Create one</a></p>
      </div>
    </div>
  </div>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
