<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard · MicroLend</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <div id="app">
    <div id="page-content">
      <div class="mb-8 flex flex-wrap items-end justify-between gap-4">
        <div>
          <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Overview</h1>
          <p class="mt-1 text-sm text-slate-500">KYC, limit, and disbursements for this account.</p>
        </div>
        <button id="request-loan-btn" type="button"
          class="inline-flex items-center rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-medium text-white shadow-sm hover:bg-indigo-700 disabled:opacity-50">
          Request loan
        </button>
      </div>
      <div class="grid gap-4 sm:grid-cols-3">
        <div class="rounded-lg bg-white p-5 shadow-sm">
          <p class="text-xs font-medium uppercase tracking-wide text-slate-500">KYC</p>
          <div id="kyc-value" class="mt-3">—</div>
        </div>
        <div class="rounded-lg bg-white p-5 shadow-sm">
          <p class="text-xs font-medium uppercase tracking-wide text-slate-500">Credit score</p>
          <p id="score-value" class="mt-2 text-2xl font-semibold text-slate-900">—</p>
        </div>
        <div class="rounded-lg bg-white p-5 shadow-sm">
          <p class="text-xs font-medium uppercase tracking-wide text-slate-500">Approved limit</p>
          <p id="limit-value" class="mt-2 text-2xl font-semibold text-slate-900">—</p>
        </div>
      </div>
      <div class="mt-8 overflow-hidden rounded-lg bg-white shadow-sm">
        <div class="border-b border-slate-100 px-5 py-4">
          <h2 class="text-sm font-semibold text-slate-900">Loans</h2>
        </div>
        <div class="overflow-x-auto">
          <table class="min-w-full divide-y divide-slate-100 text-left">
            <thead class="bg-slate-50/80">
              <tr class="text-xs font-medium uppercase tracking-wide text-slate-500">
                <th class="px-4 py-3">ID</th>
                <th class="px-4 py-3">Amount</th>
                <th class="px-4 py-3">Status</th>
                <th class="px-4 py-3">Due</th>
                <th class="px-4 py-3"></th>
              </tr>
            </thead>
            <tbody id="loans-body" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div id="loan-modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-slate-900/40" data-close-modal></div>
    <div class="relative mx-auto mt-24 w-[min(100%-2rem,28rem)] rounded-lg bg-white p-6 shadow-md">
      <h3 class="text-lg font-semibold text-slate-900">Request a loan</h3>
      <p class="mt-1 text-sm text-slate-500">Amount cannot exceed your approved limit.</p>
      <form id="loan-form" class="mt-5 space-y-4">
        <div>
          <label class="text-sm font-medium text-slate-700" for="amount">Amount (INR)</label>
          <input id="amount" name="amount" type="number" min="1" step="1" required
            class="mt-1.5 block w-full rounded-lg border-0 px-3 py-2.5 text-sm shadow-sm ring-1 ring-inset ring-slate-200 focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div class="flex justify-end gap-2">
          <button type="button" data-close-modal class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-50">Cancel</button>
          <button id="loan-submit" type="submit" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-indigo-700">Continue</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
