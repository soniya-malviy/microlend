<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loans · MicroLend</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="text-slate-800 antialiased">
  <div id="app">
    <div id="page-content">
      <div class="flex flex-wrap items-end justify-between gap-4">
        <div>
          <p class="text-xs font-semibold uppercase tracking-[0.16em] text-indigo-600">Ledger</p>
          <h1 class="mt-1 text-2xl font-semibold tracking-tight text-slate-900">Loans</h1>
          <p class="mt-1 text-sm text-slate-500">Every INR order, from pending checkout to captured disbursement.</p>
        </div>
        <a href="/dashboard.html" class="rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-700">New disbursement</a>
      </div>
      <div class="mt-8 overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-slate-100">
        <div class="overflow-x-auto">
          <table class="min-w-full divide-y divide-slate-100 text-left">
            <thead class="bg-slate-50/80">
              <tr class="text-xs font-medium uppercase tracking-wide text-slate-500">
                <th class="px-4 py-3">ID</th>
                <th class="px-4 py-3">Amount</th>
                <th class="px-4 py-3">Status</th>
                <th class="px-4 py-3">Due</th>
                <th class="px-4 py-3"></th>
              </tr>
            </thead>
            <tbody id="loans-body" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/loans.js"></script>
</body>
</html>
